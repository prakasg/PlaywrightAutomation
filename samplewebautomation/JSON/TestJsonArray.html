<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let products=[
            {
                "pid":11,
                "prodname":"Sony Laptops",
                "price":60000.00
            },
            {
                "pid":12,
                "prodname":"Lenovo Laptops",
                "price":45000.00
            },
            {
                "pid":13,
                "prodname":"Dell DEsktop",
                "price":50000.00
            }
        ]
        document.writeln(products[0].pid +"<br/>")
        document.writeln(products[0].prodname +"<br/>")
        document.writeln(products[0].price +"<br/>")
        document.writeln(products[1].pid +"<br/>")
        document.writeln(products[1].prodname +"<br/>")
        document.writeln(products[1].price +"<br/>")
        document.writeln(products[2].pid +"<br/>")
        document.writeln(products[2].prodname +"<br/>")
        document.writeln(products[2].price +"<br/>")
        document.writeln(products[0]["pid"] +"<br/>")
        document.writeln(products[0]["prodname"] +"<br/>")
        document.writeln(products[0]["price"] +"<br/>")
        document.writeln(products[1]["pid"] +"<br/>")
        document.writeln(products[1]["prodname"] +"<br/>")
        document.writeln(products[1]["price"] +"<br/>")
        document.writeln(products[2]["pid"]+"<br/>")
        document.writeln(products[2]["prodname"] +"<br/>")
        document.writeln(products[2]["price"] +"<br/>")
    </script>
</head>
