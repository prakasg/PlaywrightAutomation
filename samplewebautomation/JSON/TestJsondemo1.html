<head>
    <meta charset="UTF-8">

    <script>
        let student={
            "rollno":102,
            "firstname":"Santosh",
            "coursename":"Science and Research"
        }
        document.write(student.rollno +"<br/>")
        document.write(student.firstname +"<br/>")
        document.write(student.coursename +"<br/>")
        document.write(student["rollno"] +"<br/>")
        document.write(student["firstname"] +"<br/>")
        document.write(student["coursename"] +"<br/>")
    </script>
</head>
